<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Pluto ADS-B Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html, body { height: 100%; margin: 0; font-family: Arial, sans-serif; background: #111; color: #eee; }
#app { display: grid; grid-template-columns: minmax(420px, 1fr) 430px; height: 100%; }
#map { height: 100%; background: #222; }
#side { display: flex; flex-direction: column; min-width: 360px; border-left: 1px solid #333; background: #151515; }
#header { padding: 12px 14px; border-bottom: 1px solid #333; }
#header h1 { font-size: 20px; margin: 0 0 4px 0; }
#status { color: #aaa; font-size: 13px; margin-bottom: 9px; }
#controls {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 13px;
  color: #ddd;
}
#controls label {
  display: flex;
  align-items: center;
  gap: 5px;
}
#controls button {
  border: 1px solid #444;
  border-radius: 4px;
  background: #242424;
  color: #eee;
  padding: 4px 9px;
  cursor: pointer;
}
#controls button:hover {
  background: #333;
}
#controls button.active {
  background: #005d70;
  border-color: #00bddd;
}
#receiver-status {
  display: block;
  margin-top: 8px;
  font-size: 12px;
  color: #9da6ad;
}
.receiver-site {
  color: #ffdf4d;
  font-weight: bold;
}
.selected-row {
  background: #27343a;
}
#table-wrap { overflow: auto; flex: 1; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { border-bottom: 1px solid #2c2c2c; padding: 6px 8px; text-align: left; white-space: nowrap; }
th { position: sticky; top: 0; z-index: 1; background: #222; color: #ddd; }
tr:hover { background: #242424; cursor: pointer; }
.callsign { font-weight: bold; color: #fff; }
.muted { color: #888; }
.plane-marker { color: #00d7ff; font-size: 23px; text-shadow: 0 0 4px #000, 0 0 8px #000; transform-origin: center center; }
.plane-label { display: inline-block; margin-left: 4px; padding: 1px 4px; border-radius: 3px; background: rgba(0,0,0,0.72); color: #fff; font-size: 11px; white-space: nowrap; }
.leaflet-popup-content { margin: 9px 11px; }
.popup-title { font-weight: bold; font-size: 15px; margin-bottom: 4px; }
@media (max-width: 900px) {
  #app { grid-template-columns: 1fr; grid-template-rows: 60% 40%; }
  #side { min-width: 0; border-left: 0; border-top: 1px solid #333; }
}

/* Directional SVG marker fixes */
.plane-marker-wrap {
  position: relative;
  width: 34px;
  height: 34px;
}
.plane-marker {
  width: 30px;
  height: 30px;
  display: block;
  transform-origin: 50% 50%;
  filter: drop-shadow(0 0 3px #000) drop-shadow(0 0 5px #000);
}
.plane-marker path {
  fill: #00d7ff;
  stroke: #06151a;
  stroke-width: 1.2;
}
.plane-label {
  position: absolute;
  left: 27px;
  top: 7px;
  margin-left: 0;
}


#display-settings {
  margin-top: 10px;
  padding: 9px 10px;
  border: 1px solid #31343a;
  border-radius: 5px;
  background: #1b1d21;
  font-size: 12px;
}
#display-settings .settings-title {
  margin-bottom: 7px;
  color: #ddd;
  font-size: 13px;
  font-weight: bold;
}
#display-settings .settings-grid {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  gap: 7px 8px;
}
#display-settings label {
  color: #c5c9cf;
}
#display-settings select {
  min-width: 92px;
  padding: 3px 5px;
  color: #eee;
  background: #24272c;
  border: 1px solid #474b52;
  border-radius: 4px;
}
#display-settings .checkbox-row {
  display: flex;
  align-items: center;
  gap: 5px;
  grid-column: 1 / 3;
}


#options-panel {
  margin-top: 10px;
  border: 1px solid #31343a;
  border-radius: 5px;
  background: #1b1d21;
}
#options-panel summary {
  cursor: pointer;
  padding: 8px 10px;
  color: #ddd;
  font-size: 13px;
  font-weight: bold;
  list-style: none;
  user-select: none;
}
#options-panel summary::-webkit-details-marker {
  display: none;
}
#options-panel summary::before {
  content: '▶';
  display: inline-block;
  width: 16px;
  color: #9da6ad;
  font-size: 11px;
}
#options-panel[open] summary::before {
  content: '▼';
}
#options-panel summary:hover {
  background: #23262b;
}
#options-panel-body {
  padding: 0 10px 10px 10px;
  border-top: 1px solid #31343a;
}
#options-panel #controls {
  margin-top: 10px;
}
#options-panel #display-settings {
  margin-top: 10px;
}


/* aircraft-popups-disabled-v1 */
.plane-label {
  background: rgba(20, 23, 27, 0.94);
  border: 1px solid #3b4249;
  color: #f0f2f4;
  padding: 2px 6px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: bold;
}


#coverage-summary {
  margin-top: 10px;
  padding: 9px 10px;
  border: 1px solid #31343a;
  border-radius: 5px;
  background: #1b1d21;
  font-size: 12px;
}
#coverage-summary .coverage-title {
  margin-bottom: 7px;
  color: #ddd;
  font-size: 13px;
  font-weight: bold;
}
#coverage-summary .coverage-grid {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 5px 10px;
  margin-bottom: 8px;
}
#coverage-summary .coverage-label {
  color: #9098a0;
}
#coverage-summary .coverage-value {
  color: #e7eaed;
  text-align: right;
  font-weight: bold;
}
#coverage-summary .coverage-sort {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
#coverage-summary select {
  min-width: 150px;
  padding: 3px 5px;
  color: #eee;
  background: #24272c;
  border: 1px solid #474b52;
  border-radius: 4px;
}

</style>
</head>
<body>
<div id="app">
  <div id="map"></div>
  <div id="side">
    <div id="header">
      <h1>Pluto ADS-B Tracker</h1>
      <div id="status">Loading aircraft feed...</div>
      <div id="coverage-summary">
        <div class="coverage-title">Coverage Summary</div>
        <div class="coverage-grid">
          <span class="coverage-label">Positioned aircraft</span>
          <span class="coverage-value" id="coverage-positioned">—</span>

          <span class="coverage-label">Current farthest</span>
          <span class="coverage-value" id="coverage-current">Set receiver</span>

          <span class="coverage-label">Session maximum</span>
          <span class="coverage-value" id="coverage-maximum">Set receiver</span>
        </div>
        <div class="coverage-sort">
          <label for="aircraft-sort">Sort aircraft</label>
          <select id="aircraft-sort">
            <option value="range-desc" selected>Range: farthest first</option>
            <option value="range-asc">Range: nearest first</option>
            <option value="callsign">Callsign</option>
            <option value="altitude-desc">Altitude: highest first</option>
          </select>
        </div>
      </div>
      <details id="options-panel">
        <summary>Options</summary>
        <div id="options-panel-body">
<div id="controls">
        <label><input type="checkbox" id="show-trails" checked> Show trails</label>
        <button type="button" id="clear-trails">Clear trails</button>
        <button type="button" id="set-receiver">Set receiver</button>
        <button type="button" id="clear-receiver">Clear receiver</button>
      </div>
      <span id="receiver-status">Receiver location not set</span>
      <div id="display-settings">
        <div class="settings-title">Map Display</div>
        <div class="settings-grid">
          <label class="checkbox-row">
            <input type="checkbox" id="show-rings" checked>
            Show range rings
          </label>

          <label for="ring-max">Ring extent</label>
          <select id="ring-max">
            <option value="25">25 nm</option>
            <option value="50">50 nm</option>
            <option value="75">75 nm</option>
            <option value="100">100 nm</option>
            <option value="150" selected>150 nm</option>
            <option value="200">200 nm</option>
          </select>

          <label for="trail-points">Trail history</label>
          <select id="trail-points">
            <option value="10">10 points</option>
            <option value="25">25 points</option>
            <option value="50">50 points</option>
            <option value="80" selected>80 points</option>
            <option value="150">150 points</option>
            <option value="300">300 points</option>
          </select>
        </div>
      </div>
        </div>
      </details>

    </div>
    <div id="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Aircraft</th>
            <th>Alt</th>
            <th>Spd</th>
            <th>Trk</th>
            <th>Msgs</th>
            <th>Age</th>
            <th>Dist</th>
            <th>Brg</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const state = {
  map: null,
  markers: new Map(),
  aircraftById: new Map(),
  selectedId: null,
  initialPlaneCentered: false,
  trailPoints: new Map(),
  trailLayers: new Map(),
  showTrails: true,
  trailMaxPoints: 80,
  receiverLocation: null,
  receiverMarker: null,
  ringLayers: [],
  settingReceiverLocation: false,
  showRangeRings: true,
  ringMaxNm: 150,
  aircraftSortMode: 'range-desc',
  sessionMaximumRange: null,
  config: {
    InitialLatitude: 38.75,
    InitialLongitude: -105.18,
    InitialZoom: 8
  }
};

function fmt(value, suffix = '') {
  if (value === undefined || value === null || value === '') return '<span class="muted">—</span>';
  return String(value) + suffix;
}

function aircraftName(a) {
  return a.Call || a.Icao || String(a.Id);
}

function hasPosition(a) {
  return typeof a.Lat === 'number' && typeof a.Long === 'number';
}

function markerHtml(a) {
  /*
   * This SVG is drawn pointing straight up. On a north-up map:
   * track 0 = north, 90 = east, 180 = south, 270 = west.
   */
  const trackValue = Number(a.Trak);
  const track = Number.isFinite(trackValue) ? trackValue : 0;
  const selected = String(a.Id) === state.selectedId;
  const label = selected
    ? `<span class="plane-label">${aircraftName(a)}</span>`
    : '';

  return `
    <div class="plane-marker-wrap">
      <svg class="plane-marker" style="transform: rotate(${track}deg)" viewBox="0 0 32 32" aria-hidden="true">
        <path d="M16 2 L19.4 12.2 L29 17 L29 20 L18.7 17.9 L18 28 L16 31 L14 28 L13.3 17.9 L3 20 L3 17 L12.6 12.2 Z"></path>
      </svg>
      ${label}
    </div>
  `;
}

function aircraftIcon(a) {
  return L.divIcon({
    className: '',
    html: markerHtml(a),
    iconSize: [110, 34],
    iconAnchor: [16, 16]
  });
}

function refreshMarkerIcons() {
  for (const [id, marker] of state.markers.entries()) {
    const aircraft = state.aircraftById.get(id);
    if (aircraft) {
      marker.setIcon(aircraftIcon(aircraft));
    }
  }
}

function selectAircraft(id) {
  state.selectedId = id;

  if (state.map) {
    state.map.closePopup();
  }

  refreshMarkerIcons();

  if (state.markers.has(id)) {
  }
}

function popupHtml(a) {
  const range = distanceAndBearing(a);
  const rangeHtml = range
    ? `<div>Distance: ${range.distanceNm.toFixed(1)} nm</div>
       <div>Bearing: ${range.bearing.toFixed(0)}°</div>`
    : '';

  return `
    <div class="popup-title">${aircraftName(a)}</div>
    <div>ICAO: ${fmt(a.Icao)}</div>
    <div>Altitude: ${fmt(a.Alt, ' ft')}</div>
    <div>Speed: ${fmt(a.Spd, ' kt')}</div>
    <div>Track: ${fmt(a.Trak, '°')}</div>
    <div>Messages: ${fmt(a.CMsgs)}</div>
    <div>Age: ${fmt(a.TSecs, 's')}</div>
    ${rangeHtml}
  `;
}

async function loadConfig() {
  try {
    const response = await fetch('/VirtualRadar/ServerConfig.json?_=' + Date.now());
    const config = await response.json();
    state.config = Object.assign(state.config, config || {});
  } catch (e) {
    console.log('Using default map config:', e);
  }
}

function initMap() {
  state.map = L.map('map').setView(
    [state.config.InitialLatitude, state.config.InitialLongitude],
    state.config.InitialZoom
  );

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(state.map);

  /*
   * Clicking open map space clears the selection and hides the callsign tag.
   */
  state.map.on('click', event => {
    if (state.settingReceiverLocation) {
      finishReceiverSelection(event.latlng);
      return;
    }

    state.selectedId = null;
    refreshMarkerIcons();
  });
}

const RECEIVER_STORAGE_KEY = 'plutoAdsBReceiverLocation';
function rangeRingsNm() {
  if (!state.showRangeRings) {
    return [];
  }

  return Array.from(
    { length: Math.floor(state.ringMaxNm / 5) },
    (_, index) => (index + 1) * 5
  );
}

const DISPLAY_SETTINGS_STORAGE_KEY = 'plutoAdsBMapDisplaySettingsV1';

function loadDisplaySettings() {
  try {
    const saved = window.localStorage.getItem(DISPLAY_SETTINGS_STORAGE_KEY);

    if (saved) {
      const settings = JSON.parse(saved);

      if (typeof settings.showRangeRings === 'boolean') {
        state.showRangeRings = settings.showRangeRings;
      }

      if ([25, 50, 75, 100, 150, 200].includes(Number(settings.ringMaxNm))) {
        state.ringMaxNm = Number(settings.ringMaxNm);
      }

      if ([10, 25, 50, 80, 150, 300].includes(Number(settings.trailMaxPoints))) {
        state.trailMaxPoints = Number(settings.trailMaxPoints);
      }
    }
  } catch (e) {
    console.log('Unable to load map display settings:', e);
  }

  document.getElementById('show-rings').checked = state.showRangeRings;
  document.getElementById('ring-max').value = String(state.ringMaxNm);
  document.getElementById('trail-points').value = String(state.trailMaxPoints);
}

function saveDisplaySettings() {
  try {
    window.localStorage.setItem(
      DISPLAY_SETTINGS_STORAGE_KEY,
      JSON.stringify({
        showRangeRings: state.showRangeRings,
        ringMaxNm: state.ringMaxNm,
        trailMaxPoints: state.trailMaxPoints
      })
    );
  } catch (e) {
    console.log('Unable to save map display settings:', e);
  }
}

function trimExistingTrails() {
  for (const [id, points] of state.trailPoints.entries()) {
    while (points.length > state.trailMaxPoints) {
      points.shift();
    }

    if (state.trailLayers.has(id)) {
      state.trailLayers.get(id).setLatLngs(points);
    }
  }
}

function updateReceiverStatus(message = null) {
  const status = document.getElementById('receiver-status');

  if (message) {
    status.textContent = message;
    return;
  }

  if (!state.receiverLocation) {
    status.textContent = 'Receiver location not set';
    return;
  }

  const ringsText = state.showRangeRings
    ? `Rings: every 5 nm to ${state.ringMaxNm} nm`
    : 'Rings hidden';

  status.textContent =
    `Receiver: ${state.receiverLocation.lat.toFixed(5)}, ${state.receiverLocation.lon.toFixed(5)} | ${ringsText}`;
}

function loadReceiverLocation() {
  try {
    const saved = window.localStorage.getItem(RECEIVER_STORAGE_KEY);
    if (!saved) return;

    const parsed = JSON.parse(saved);

    if (typeof parsed.lat === 'number' && typeof parsed.lon === 'number') {
      state.receiverLocation = parsed;
    }
  } catch (e) {
    console.log('Unable to load receiver location:', e);
  }
}

function saveReceiverLocation() {
  try {
    if (state.receiverLocation) {
      window.localStorage.setItem(
        RECEIVER_STORAGE_KEY,
        JSON.stringify(state.receiverLocation)
      );
    } else {
      window.localStorage.removeItem(RECEIVER_STORAGE_KEY);
    }
  } catch (e) {
    console.log('Unable to save receiver location:', e);
  }
}

function removeReceiverLayers() {
  if (state.receiverMarker) {
    state.map.removeLayer(state.receiverMarker);
    state.receiverMarker = null;
  }

  for (const layer of state.ringLayers) {
    state.map.removeLayer(layer);
  }

  state.ringLayers = [];
}

function drawReceiverLocation() {
  removeReceiverLayers();

  if (!state.receiverLocation) {
    updateReceiverStatus();
    return;
  }

  const position = [
    state.receiverLocation.lat,
    state.receiverLocation.lon
  ];

  state.receiverMarker = L.circleMarker(position, {
    radius: 7,
    color: '#111',
    weight: 2,
    fillColor: '#ffdf4d',
    fillOpacity: 1
  }).addTo(state.map);

  state.receiverMarker.bindPopup(
    `<div class="popup-title">Receiver Site</div>
     <div>Latitude: ${state.receiverLocation.lat.toFixed(6)}</div>
     <div>Longitude: ${state.receiverLocation.lon.toFixed(6)}</div>`
  );

  for (const ringNm of rangeRingsNm()) {
    const majorRing = ringNm % 25 === 0;

    const ring = L.circle(position, {
      radius: ringNm * 1852,
      color: majorRing ? '#30343b' : '#444951',
      weight: majorRing ? 2 : 1,
      opacity: majorRing ? 0.90 : 0.52,
      fill: false,
      dashArray: majorRing ? '7 6' : '3 8',
      interactive: false
    });

    ring.addTo(state.map);
    state.ringLayers.push(ring);
  }

  updateReceiverStatus();
}

function beginReceiverSelection() {
  state.settingReceiverLocation = true;
  const button = document.getElementById('set-receiver');
  button.classList.add('active');
  button.textContent = 'Click map location...';
  state.map.getContainer().style.cursor = 'crosshair';
  updateReceiverStatus('Click the map at your receiver antenna location.');
}

function finishReceiverSelection(latlng) {
  state.receiverLocation = {
    lat: latlng.lat,
    lon: latlng.lng
  };

  state.sessionMaximumRange = null;
  state.settingReceiverLocation = false;

  const button = document.getElementById('set-receiver');
  button.classList.remove('active');
  button.textContent = 'Set receiver';
  state.map.getContainer().style.cursor = '';

  saveReceiverLocation();
  drawReceiverLocation();
}

function clearReceiverLocation() {
  state.settingReceiverLocation = false;
  state.receiverLocation = null;
  state.sessionMaximumRange = null;

  const button = document.getElementById('set-receiver');
  button.classList.remove('active');
  button.textContent = 'Set receiver';
  state.map.getContainer().style.cursor = '';

  saveReceiverLocation();
  drawReceiverLocation();
}

function distanceAndBearing(a) {
  if (!state.receiverLocation || !hasPosition(a)) {
    return null;
  }

  const toRad = degrees => degrees * Math.PI / 180;
  const toDeg = radians => radians * 180 / Math.PI;

  const lat1 = toRad(state.receiverLocation.lat);
  const lon1 = toRad(state.receiverLocation.lon);
  const lat2 = toRad(a.Lat);
  const lon2 = toRad(a.Long);

  const dLat = lat2 - lat1;
  const dLon = lon2 - lon1;

  const h =
    Math.sin(dLat / 2) * Math.sin(dLat / 2) +
    Math.cos(lat1) * Math.cos(lat2) *
    Math.sin(dLon / 2) * Math.sin(dLon / 2);

  const distanceNm = 3440.065 * 2 * Math.atan2(Math.sqrt(h), Math.sqrt(1 - h));

  const y = Math.sin(dLon) * Math.cos(lat2);
  const x =
    Math.cos(lat1) * Math.sin(lat2) -
    Math.sin(lat1) * Math.cos(lat2) * Math.cos(dLon);

  const bearing = (toDeg(Math.atan2(y, x)) + 360) % 360;

  return {
    distanceNm,
    bearing
  };
}

function updateTrail(a) {
  const id = String(a.Id);
  const point = [a.Lat, a.Long];
  const points = state.trailPoints.get(id) || [];
  const previous = points.length ? points[points.length - 1] : null;

  /*
   * Only record an actual position change. A visible line requires two
   * different decoded ADS-B positions from the same aircraft.
   */
  if (!previous || previous[0] !== point[0] || previous[1] !== point[1]) {
    points.push(point);

    while (points.length > state.trailMaxPoints) {
      points.shift();
    }

    state.trailPoints.set(id, points);
  }

  if (points.length < 2) {
    return;
  }

  if (!state.trailLayers.has(id)) {
    const layer = L.polyline(points, {
      color: '#00d7ff',
      weight: 3,
      opacity: 0.90,
      dashArray: '7 5',
      lineCap: 'round',
      lineJoin: 'round',
      interactive: false
    });

    state.trailLayers.set(id, layer);

    if (state.showTrails) {
      layer.addTo(state.map);
    }
  } else {
    state.trailLayers.get(id).setLatLngs(points);
  }
}

function removeTrail(id) {
  if (state.trailLayers.has(id)) {
    state.map.removeLayer(state.trailLayers.get(id));
    state.trailLayers.delete(id);
  }

  state.trailPoints.delete(id);
}

function setTrailsVisible(visible) {
  state.showTrails = visible;

  for (const layer of state.trailLayers.values()) {
    if (visible) {
      layer.addTo(state.map);
    } else {
      state.map.removeLayer(layer);
    }
  }
}

function clearTrails() {
  for (const layer of state.trailLayers.values()) {
    state.map.removeLayer(layer);
  }

  state.trailLayers.clear();
  state.trailPoints.clear();
}

function updateMarkers(acList) {
  const seen = new Set();

  state.aircraftById = new Map(
    acList.map(a => [String(a.Id), a])
  );

  for (const a of acList) {
    if (!hasPosition(a)) continue;

    const id = String(a.Id);
    seen.add(id);

    /*
     * Center once on the first aircraft with decoded coordinates.
     */
    if (!state.initialPlaneCentered) {
      state.map.setView([a.Lat, a.Long], state.map.getZoom());
      state.initialPlaneCentered = true;
    }

    if (!state.markers.has(id)) {
      const marker = L.marker([a.Lat, a.Long], {
        icon: aircraftIcon(a),
        bubblingMouseEvents: false
      });

      marker.addTo(state.map);

      marker.on('click', () => {
        selectAircraft(id);
      });

      state.markers.set(id, marker);
    }

    const marker = state.markers.get(id);
    marker.setLatLng([a.Lat, a.Long]);
    marker.setIcon(aircraftIcon(a));
    /* Aircraft details appear in the right-side selected panel only. */
    marker.unbindPopup();
    updateTrail(a);
  }

  for (const [id, marker] of state.markers.entries()) {
    if (!seen.has(id)) {
      state.map.removeLayer(marker);
      state.markers.delete(id);

      /*
       * Intentionally retain the trail after an aircraft falls out of the
       * active feed. This makes completed tracks visible until the user
       * presses Clear trails or refreshes the page.
       */
    }
  }
}

const AIRCRAFT_SORT_STORAGE_KEY = 'plutoAdsBAircraftSortModeV1';

function loadAircraftSortMode() {
  try {
    const saved = window.localStorage.getItem(AIRCRAFT_SORT_STORAGE_KEY);
    const allowed = ['range-desc', 'range-asc', 'callsign', 'altitude-desc'];

    if (allowed.includes(saved)) {
      state.aircraftSortMode = saved;
    }
  } catch (e) {
    console.log('Unable to load aircraft sort mode:', e);
  }

  document.getElementById('aircraft-sort').value = state.aircraftSortMode;
}

function saveAircraftSortMode() {
  try {
    window.localStorage.setItem(AIRCRAFT_SORT_STORAGE_KEY, state.aircraftSortMode);
  } catch (e) {
    console.log('Unable to save aircraft sort mode:', e);
  }
}

function aircraftRangeRecord(a) {
  const range = distanceAndBearing(a);

  if (!range) {
    return null;
  }

  return {
    aircraft: a,
    distanceNm: range.distanceNm,
    bearing: range.bearing
  };
}

function rangeAircraftName(record) {
  return aircraftName(record.aircraft);
}

function updateCoverageSummary(acList) {
  const positionedCount = acList.filter(hasPosition).length;
  const positionedField = document.getElementById('coverage-positioned');
  const currentField = document.getElementById('coverage-current');
  const maximumField = document.getElementById('coverage-maximum');

  positionedField.textContent = String(positionedCount);

  if (!state.receiverLocation) {
    currentField.textContent = 'Set receiver';
    maximumField.textContent = 'Set receiver';
    return;
  }

  const ranged = acList
    .map(aircraftRangeRecord)
    .filter(record => record !== null)
    .sort((a, b) => b.distanceNm - a.distanceNm);

  if (!ranged.length) {
    currentField.textContent = 'No positions';
    maximumField.textContent = state.sessionMaximumRange
      ? `${state.sessionMaximumRange.distanceNm.toFixed(1)} nm · ${state.sessionMaximumRange.name}`
      : 'No positions';
    return;
  }

  const farthest = ranged[0];

  currentField.textContent =
    `${farthest.distanceNm.toFixed(1)} nm · ${rangeAircraftName(farthest)}`;

  if (!state.sessionMaximumRange ||
      farthest.distanceNm > state.sessionMaximumRange.distanceNm) {
    state.sessionMaximumRange = {
      distanceNm: farthest.distanceNm,
      name: rangeAircraftName(farthest),
      time: new Date()
    };
  }

  maximumField.textContent =
    `${state.sessionMaximumRange.distanceNm.toFixed(1)} nm · ${state.sessionMaximumRange.name}`;
}

function compareAircraftForList(a, b) {
  if (state.aircraftSortMode === 'range-desc' ||
      state.aircraftSortMode === 'range-asc') {
    const ar = distanceAndBearing(a);
    const br = distanceAndBearing(b);

    if (ar && br) {
      return state.aircraftSortMode === 'range-desc'
        ? br.distanceNm - ar.distanceNm
        : ar.distanceNm - br.distanceNm;
    }

    if (ar) return -1;
    if (br) return 1;
  }

  if (state.aircraftSortMode === 'altitude-desc') {
    const altitudeDifference = Number(b.Alt || -1) - Number(a.Alt || -1);

    if (altitudeDifference !== 0) {
      return altitudeDifference;
    }
  }

  return aircraftName(a).localeCompare(aircraftName(b));
}

function updateTable(acList) {
  const rows = document.getElementById('rows');
  rows.innerHTML = '';

  const sorted = [...acList].sort(compareAircraftForList);

  for (const a of sorted) {
    const tr = document.createElement('tr');
    const id = String(a.Id);
    const name = aircraftName(a);
    const range = distanceAndBearing(a);
    const distance = range ? `${range.distanceNm.toFixed(1)} nm` : '';
    const bearing = range ? `${range.bearing.toFixed(0)}°` : '';

    if (id === state.selectedId) {
      tr.className = 'selected-row';
    }

    tr.innerHTML = `
      <td><span class="callsign">${name}</span><br><span class="muted">${fmt(a.Icao)}</span></td>
      <td>${fmt(a.Alt)}</td>
      <td>${fmt(a.Spd)}</td>
      <td>${fmt(a.Trak)}</td>
      <td>${fmt(a.CMsgs)}</td>
      <td>${fmt(a.TSecs, 's')}</td>
      <td>${fmt(distance)}</td>
      <td>${fmt(bearing)}</td>
    `;

    tr.onclick = () => {
      state.selectedId = id;
      refreshMarkerIcons();
      updateTable(acList);

      if (hasPosition(a) && state.markers.has(id)) {
        state.map.setView([a.Lat, a.Long], Math.max(state.map.getZoom(), 9));
      }
    };

    rows.appendChild(tr);
  }
}

async function refresh() {
  const status = document.getElementById('status');

  try {
    const response = await fetch('/VirtualRadar/AircraftList.json?_=' + Date.now());
    const data = await response.json();
    const acList = data.acList || [];
    const positioned = acList.filter(hasPosition).length;

    updateCoverageSummary(acList);

    status.textContent =
      `Aircraft: ${data.totalAc || acList.length} | Positioned: ${positioned} | Server: ${new Date(data.stm).toLocaleString()}`;

    updateMarkers(acList);
    updateTable(acList);
  } catch (e) {
    status.textContent = 'Error loading aircraft feed: ' + e;
  }
}

async function main() {
  await loadConfig();
  initMap();

  document.getElementById('show-trails').addEventListener('change', event => {
    setTrailsVisible(event.target.checked);
  });

  document.getElementById('clear-trails').addEventListener('click', () => {
    clearTrails();
  });

  document.getElementById('set-receiver').addEventListener('click', () => {
    beginReceiverSelection();
  });

  document.getElementById('clear-receiver').addEventListener('click', () => {
    clearReceiverLocation();
  });

  loadReceiverLocation();
  loadDisplaySettings();
  loadAircraftSortMode();
  drawReceiverLocation();

  document.getElementById('aircraft-sort').addEventListener('change', event => {
    state.aircraftSortMode = event.target.value;
    saveAircraftSortMode();
  });

  document.getElementById('show-rings').addEventListener('change', event => {
    state.showRangeRings = event.target.checked;
    saveDisplaySettings();
    drawReceiverLocation();
  });

  document.getElementById('ring-max').addEventListener('change', event => {
    state.ringMaxNm = Number(event.target.value);
    saveDisplaySettings();
    drawReceiverLocation();
  });

  document.getElementById('trail-points').addEventListener('change', event => {
    state.trailMaxPoints = Number(event.target.value);
    saveDisplaySettings();
    trimExistingTrails();
  });

  await refresh();
  setInterval(refresh, 1000);
}

main();
</script>

        [aircraft.Lat, aircraft.Long],

      );

      const id = String(aircraft.Id);
      if (state.markers && state.markers.has(id)) {
      }
    });

    document.getElementById('selected-clear').addEventListener('click', function () {

      if (state.map) {

    installed = true;

  function renderPanel() {

      range ? range.bearing.toFixed(0) + '°' : '—';

    panel.classList.add('visible');
  }

  function start() {
    if (!installPanel()) {
      window.setTimeout(start, 250);
      return;
    }

    renderPanel();
    window.setInterval(renderPanel, 250);
  }

  start();
})();

<script id="airband-listen-ui-v1">
(function () {
  let channels = [];
  let selectedChannel = null;
  let recommendation = null;
  let metadata = null;
  let installed = false;
  let selectedReceiverKey = null;
  let actionStatus = '';

  function distanceNm(lat1, lon1, lat2, lon2) {
    const toRad = value => value * Math.PI / 180;
    const p1 = toRad(lat1);
    const p2 = toRad(lat2);
    const dLat = toRad(lat2 - lat1);
    const dLon = toRad(lon2 - lon1);

    const h =
      Math.sin(dLat / 2) * Math.sin(dLat / 2) +
      Math.cos(p1) * Math.cos(p2) *
      Math.sin(dLon / 2) * Math.sin(dLon / 2);

    return 3440.065 * 2 * Math.atan2(Math.sqrt(h), Math.sqrt(1 - h));
  }

  function receiverKey() {
    if (typeof state === 'undefined' || !state.receiverLocation) {
      return '';
    }

    return (
      state.receiverLocation.lat.toFixed(6) + '|' +
      state.receiverLocation.lon.toFixed(6)
    );
  }

  function channelKey(channel) {
    if (!channel) return '';

    return [
      channel.airport_code || '',
      channel.frequency_hz || '',
      channel.use || '',
      channel.facility_id || ''
    ].join('|');
  }

  function channelName(channel) {
    if (!channel) return '';

    return channel.airport_code ||
      channel.facility_id ||
      channel.facility_name ||
      channel.city ||
      'Unknown facility';
  }

  function voicePriority(channel) {
    const text = (
      (channel.use || '') + ' ' +
      (channel.facility_type || '') + ' ' +
      (channel.facility_name || '')
    ).toUpperCase();

    if (text.includes('TOWER') ||
        text.includes('CTAF') ||
        text.includes('UNICOM')) {
      return 1;
    }

    if (text.includes('APPROACH') ||
        text.includes('APCH') ||
        text.includes('DEPARTURE') ||
        text.includes(' DEPART') ||
        text.includes(' DEP ')) {
      return 2;
    }

    if (text.includes('GROUND')) {
      return 3;
    }

    if (text.includes('CLEARANCE') ||
        text.includes('CLNC') ||
        text.includes('DELIVERY')) {
      return 4;
    }

    if (text.includes('ATIS') ||
        text.includes('AWOS') ||
        text.includes('ASOS')) {
      return 6;
    }

    return 5;
  }

  function rankedChannels() {
    if (typeof state === 'undefined' || !state.receiverLocation) {
      return [];
    }

    return channels
      .map(channel => ({
        ...channel,
        distance_nm: distanceNm(
          state.receiverLocation.lat,
          state.receiverLocation.lon,
          channel.lat,
          channel.lon
        ),
        voice_priority: voicePriority(channel)
      }))
      .sort((a, b) =>
        a.distance_nm - b.distance_nm ||
        a.voice_priority - b.voice_priority ||
        a.frequency_mhz - b.frequency_mhz
      );
  }

  function recommendedChannel(ranked) {
    if (!ranked.length) {
      return null;
    }

    /*
     * Pick the closest airport/facility first, then choose its best useful
     * voice frequency. This prevents a distant Tower frequency from being
     * recommended over a nearby airport.
     */
    const nearest = ranked[0];
    const airportCode = nearest.airport_code || nearest.facility_id;

    const sameAirport = ranked.filter(channel =>
      (channel.airport_code || channel.facility_id) === airportCode
    );

    return sameAirport
      .sort((a, b) =>
        a.voice_priority - b.voice_priority ||
        a.distance_nm - b.distance_nm ||
        a.frequency_mhz - b.frequency_mhz
      )[0] || nearest;
  }

  function selectChannel(channel, reason) {
    selectedChannel = channel;
    actionStatus = '';

    const selected = document.getElementById('airband-selected');

    if (!channel) {
      selected.textContent = 'Select a listed frequency.';
      return;
    }

    const prefix = reason === 'recommended'
      ? 'Recommended'
      : 'Selected';

    selected.textContent =
      `${prefix}: ${channel.frequency_mhz.toFixed(3)} MHz AM · ` +
      `${channel.use || 'Published'} · ${channelName(channel)} · ` +
      `${channel.distance_nm.toFixed(1)} nm`;
  }

  function automaticallyChooseBest(ranked, force) {
    recommendation = recommendedChannel(ranked);

    if (!recommendation) {
      return;
    }

    const currentReceiverKey = receiverKey();

    if (force ||
        !selectedChannel ||
        selectedReceiverKey !== currentReceiverKey) {
      selectedReceiverKey = currentReceiverKey;
      selectChannel(recommendation, 'recommended');
    }
  }

  function installPanel() {
    if (installed) return true;

    const header = document.getElementById('header');
    const options = document.getElementById('options-panel');

    if (!header || typeof state === 'undefined') return false;

    const panel = document.createElement('details');
    panel.id = 'airband-panel';
    panel.innerHTML = `
      <summary>Airband Listen</summary>
      <div id="airband-panel-body">
        <div id="airband-status">Loading FAA airband frequency data...</div>
        <div id="airband-source"></div>
        <div id="airband-table-wrap">
          <table id="airband-table">
            <thead>
              <tr>
                <th>Freq</th>
                <th>Use / Facility</th>
                <th>Dist</th>
              </tr>
            </thead>
            <tbody id="airband-rows"></tbody>
          </table>
        </div>
        <div id="airband-selected">Select a listed frequency.</div>
        <div class="airband-actions">
          <button type="button" id="airband-best">Select Best Nearby</button>
          <button type="button" id="airband-listen">Listen</button>
          <button type="button" id="airband-stop" disabled>Stop / Resume ADS-B</button>
        </div>
      </div>
    `;

    if (options) {
      header.insertBefore(panel, options);
    } else {
      header.appendChild(panel);
    }

    document.getElementById('airband-best').addEventListener('click', function () {
      const ranked = rankedChannels();

      if (!ranked.length) {
        document.getElementById('airband-status').textContent =
          'Set the receiver location before selecting a nearby frequency.';
        return;
      }

      automaticallyChooseBest(ranked, true);
      render();
    });

    document.getElementById('airband-listen').addEventListener('click', function () {
      if (!selectedChannel) {
        actionStatus = 'Select a frequency before starting listen mode.';
        render();
        return;
      }

      actionStatus =
        `Audio backend not installed yet. Selected ` +
        `${selectedChannel.frequency_mhz.toFixed(3)} MHz AM · ` +
        `${channelName(selectedChannel)}. ADS-B tracking remains active.`;

      render();
    });

    document.getElementById('airband-stop').addEventListener('click', function () {
      actionStatus = 'ADS-B tracking active.';
      render();
    });

    installed = true;
    return true;
  }

  function render() {
    if (!installPanel()) return;

    const status = document.getElementById('airband-status');
    const source = document.getElementById('airband-source');
    const rows = document.getElementById('airband-rows');

    if (!metadata) {
      status.textContent = 'FAA frequency database not loaded.';
      return;
    }

    const airportList = Array.isArray(metadata.airports)
      ? metadata.airports.join(', ')
      : '';

    source.textContent =
      `FAA NASR effective ${metadata.effective_date || 'unknown'} · ` +
      `${metadata.record_count || channels.length} channels` +
      (airportList ? ` · ${airportList}` : '');

    if (!state.receiverLocation) {
      status.textContent =
        'Set the receiver location in Options to find nearby airband frequencies.';
      rows.innerHTML = '';
      selectedChannel = null;
      selectedReceiverKey = null;
      document.getElementById('airband-selected').textContent =
        'Select a listed frequency.';
      return;
    }

    const ranked = rankedChannels();
    automaticallyChooseBest(ranked, false);

    if (actionStatus) {
      status.textContent = actionStatus;
    } else if (recommendation) {
      status.textContent =
        `Best nearby voice channel: ${recommendation.frequency_mhz.toFixed(3)} MHz AM · ` +
        `${recommendation.use || 'Published'} · ${channelName(recommendation)}`;
    } else {
      status.textContent = 'No nearby VHF frequencies found in the deployed database.';
    }

    rows.innerHTML = '';

    /*
     * Show up to 20 closest channels. The recommended channel is highlighted
     * even when the user selects another channel manually.
     */
    for (const channel of ranked.slice(0, 20)) {
      const tr = document.createElement('tr');
      const isSelected =
        selectedChannel &&
        channelKey(selectedChannel) === channelKey(channel);

      const isRecommended =
        recommendation &&
        channelKey(recommendation) === channelKey(channel);

      if (isSelected) {
        tr.className = 'selected-airband';
      }

      const star = isRecommended ? '★ ' : '';

      tr.innerHTML = `
        <td class="airband-frequency">${star}${channel.frequency_mhz.toFixed(3)}</td>
        <td>${channel.use || channel.facility_type || 'Published'}<br>
          <span class="muted">${channelName(channel)}</span>
        </td>
        <td>${channel.distance_nm.toFixed(1)} nm</td>
      `;

      tr.addEventListener('click', function () {
        selectedReceiverKey = receiverKey();
        selectChannel(channel, 'manual');
        render();
      });

      rows.appendChild(tr);
    }
  }

  async function loadData() {
    try {
      const response = await fetch(
        '/VirtualRadar/Airband/Frequencies.json?_=' + Date.now(),
        { cache: 'no-store' }
      );

      const data = await response.json();

      metadata = data.metadata || {};
      channels = data.channels || [];

      if (!channels.length) {
        actionStatus = metadata.message || 'No airband frequency records are deployed.';
      }

      render();
    } catch (error) {
      document.getElementById('airband-status').textContent =
        'Unable to load airband frequency database: ' + error;
    }
  }

  function start() {
    if (!installPanel()) {
      window.setTimeout(start, 250);
      return;
    }

    loadData();
    window.setInterval(render, 1000);
  }

  start();
})();
</script>

</body>
</html>
