<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Pluto ADS-B Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html, body { height: 100%; margin: 0; font-family: Arial, sans-serif; background: #111; color: #eee; }
#app { display: grid; grid-template-columns: minmax(420px, 1fr) 430px; height: 100%; }
#map { height: 100%; background: #222; }
#side { display: flex; flex-direction: column; min-width: 360px; border-left: 1px solid #333; background: #151515; }
#header { padding: 12px 14px; border-bottom: 1px solid #333; }
#header h1 { font-size: 20px; margin: 0 0 4px 0; }
#status { color: #aaa; font-size: 13px; margin-bottom: 9px; }
#controls {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 13px;
  color: #ddd;
}
#controls label {
  display: flex;
  align-items: center;
  gap: 5px;
}
#controls button {
  border: 1px solid #444;
  border-radius: 4px;
  background: #242424;
  color: #eee;
  padding: 4px 9px;
  cursor: pointer;
}
#controls button:hover {
  background: #333;
}
#controls button.active {
  background: #005d70;
  border-color: #00bddd;
}
#receiver-status {
  display: block;
  margin-top: 8px;
  font-size: 12px;
  color: #9da6ad;
}
.receiver-site {
  color: #ffdf4d;
  font-weight: bold;
}
.selected-row {
  background: #27343a;
}
#table-wrap { overflow: auto; flex: 1; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { border-bottom: 1px solid #2c2c2c; padding: 6px 8px; text-align: left; white-space: nowrap; }
th { position: sticky; top: 0; z-index: 1; background: #222; color: #ddd; }
tr:hover { background: #242424; cursor: pointer; }
.callsign { font-weight: bold; color: #fff; }
.muted { color: #888; }
.plane-marker { color: #00d7ff; font-size: 23px; text-shadow: 0 0 4px #000, 0 0 8px #000; transform-origin: center center; }
.plane-label { display: inline-block; margin-left: 4px; padding: 1px 4px; border-radius: 3px; background: rgba(0,0,0,0.72); color: #fff; font-size: 11px; white-space: nowrap; }
.leaflet-popup-content { margin: 9px 11px; }
.popup-title { font-weight: bold; font-size: 15px; margin-bottom: 4px; }
@media (max-width: 900px) {
  #app { grid-template-columns: 1fr; grid-template-rows: 60% 40%; }
  #side { min-width: 0; border-left: 0; border-top: 1px solid #333; }
}

/* Directional SVG marker fixes */
.plane-marker-wrap {
  position: relative;
  width: 34px;
  height: 34px;
}
.plane-marker {
  width: 30px;
  height: 30px;
  display: block;
  transform-origin: 50% 50%;
  filter: drop-shadow(0 0 3px #000) drop-shadow(0 0 5px #000);
}
.plane-marker path {
  fill: #00d7ff;
  stroke: #06151a;
  stroke-width: 1.2;
}
.plane-label {
  position: absolute;
  left: 27px;
  top: 7px;
  margin-left: 0;
}

</style>
</head>
<body>
<div id="app">
  <div id="map"></div>
  <div id="side">
    <div id="header">
      <h1>Pluto ADS-B Tracker</h1>
      <div id="status">Loading aircraft feed...</div>
      <div id="controls">
        <label><input type="checkbox" id="show-trails" checked> Show trails</label>
        <button type="button" id="clear-trails">Clear trails</button>
        <button type="button" id="set-receiver">Set receiver</button>
        <button type="button" id="clear-receiver">Clear receiver</button>
      </div>
      <span id="receiver-status">Receiver location not set</span>
    </div>
    <div id="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Aircraft</th>
            <th>Alt</th>
            <th>Spd</th>
            <th>Trk</th>
            <th>Msgs</th>
            <th>Age</th>
            <th>Dist</th>
            <th>Brg</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const state = {
  map: null,
  markers: new Map(),
  aircraftById: new Map(),
  selectedId: null,
  initialPlaneCentered: false,
  trailPoints: new Map(),
  trailLayers: new Map(),
  showTrails: true,
  trailMaxPoints: 80,
  receiverLocation: null,
  receiverMarker: null,
  ringLayers: [],
  settingReceiverLocation: false,
  config: {
    InitialLatitude: 38.75,
    InitialLongitude: -105.18,
    InitialZoom: 8
  }
};

function fmt(value, suffix = '') {
  if (value === undefined || value === null || value === '') return '<span class="muted">—</span>';
  return String(value) + suffix;
}

function aircraftName(a) {
  return a.Call || a.Icao || String(a.Id);
}

function hasPosition(a) {
  return typeof a.Lat === 'number' && typeof a.Long === 'number';
}

function markerHtml(a) {
  /*
   * This SVG is drawn pointing straight up. On a north-up map:
   * track 0 = north, 90 = east, 180 = south, 270 = west.
   */
  const trackValue = Number(a.Trak);
  const track = Number.isFinite(trackValue) ? trackValue : 0;
  const selected = String(a.Id) === state.selectedId;
  const label = selected
    ? `<span class="plane-label">${aircraftName(a)}</span>`
    : '';

  return `
    <div class="plane-marker-wrap">
      <svg class="plane-marker" style="transform: rotate(${track}deg)" viewBox="0 0 32 32" aria-hidden="true">
        <path d="M16 2 L19.4 12.2 L29 17 L29 20 L18.7 17.9 L18 28 L16 31 L14 28 L13.3 17.9 L3 20 L3 17 L12.6 12.2 Z"></path>
      </svg>
      ${label}
    </div>
  `;
}

function aircraftIcon(a) {
  return L.divIcon({
    className: '',
    html: markerHtml(a),
    iconSize: [110, 34],
    iconAnchor: [16, 16]
  });
}

function refreshMarkerIcons() {
  for (const [id, marker] of state.markers.entries()) {
    const aircraft = state.aircraftById.get(id);
    if (aircraft) {
      marker.setIcon(aircraftIcon(aircraft));
    }
  }
}

function selectAircraft(id) {
  state.selectedId = id;
  refreshMarkerIcons();

  if (state.markers.has(id)) {
    state.markers.get(id).openPopup();
  }
}

function popupHtml(a) {
  const range = distanceAndBearing(a);
  const rangeHtml = range
    ? `<div>Distance: ${range.distanceNm.toFixed(1)} nm</div>
       <div>Bearing: ${range.bearing.toFixed(0)}°</div>`
    : '';

  return `
    <div class="popup-title">${aircraftName(a)}</div>
    <div>ICAO: ${fmt(a.Icao)}</div>
    <div>Altitude: ${fmt(a.Alt, ' ft')}</div>
    <div>Speed: ${fmt(a.Spd, ' kt')}</div>
    <div>Track: ${fmt(a.Trak, '°')}</div>
    <div>Messages: ${fmt(a.CMsgs)}</div>
    <div>Age: ${fmt(a.TSecs, 's')}</div>
    ${rangeHtml}
  `;
}

async function loadConfig() {
  try {
    const response = await fetch('/VirtualRadar/ServerConfig.json?_=' + Date.now());
    const config = await response.json();
    state.config = Object.assign(state.config, config || {});
  } catch (e) {
    console.log('Using default map config:', e);
  }
}

function initMap() {
  state.map = L.map('map').setView(
    [state.config.InitialLatitude, state.config.InitialLongitude],
    state.config.InitialZoom
  );

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(state.map);

  /*
   * Clicking open map space clears the selection and hides the callsign tag.
   */
  state.map.on('click', event => {
    if (state.settingReceiverLocation) {
      finishReceiverSelection(event.latlng);
      return;
    }

    state.selectedId = null;
    refreshMarkerIcons();
  });
}

const RECEIVER_STORAGE_KEY = 'plutoAdsBReceiverLocation';
const RANGE_RINGS_NM = [25, 50, 100, 150];

function updateReceiverStatus(message = null) {
  const status = document.getElementById('receiver-status');

  if (message) {
    status.textContent = message;
    return;
  }

  if (!state.receiverLocation) {
    status.textContent = 'Receiver location not set';
    return;
  }

  status.textContent =
    `Receiver: ${state.receiverLocation.lat.toFixed(5)}, ${state.receiverLocation.lon.toFixed(5)} | Rings: 25 / 50 / 100 / 150 nm`;
}

function loadReceiverLocation() {
  try {
    const saved = window.localStorage.getItem(RECEIVER_STORAGE_KEY);
    if (!saved) return;

    const parsed = JSON.parse(saved);

    if (typeof parsed.lat === 'number' && typeof parsed.lon === 'number') {
      state.receiverLocation = parsed;
    }
  } catch (e) {
    console.log('Unable to load receiver location:', e);
  }
}

function saveReceiverLocation() {
  try {
    if (state.receiverLocation) {
      window.localStorage.setItem(
        RECEIVER_STORAGE_KEY,
        JSON.stringify(state.receiverLocation)
      );
    } else {
      window.localStorage.removeItem(RECEIVER_STORAGE_KEY);
    }
  } catch (e) {
    console.log('Unable to save receiver location:', e);
  }
}

function removeReceiverLayers() {
  if (state.receiverMarker) {
    state.map.removeLayer(state.receiverMarker);
    state.receiverMarker = null;
  }

  for (const layer of state.ringLayers) {
    state.map.removeLayer(layer);
  }

  state.ringLayers = [];
}

function drawReceiverLocation() {
  removeReceiverLayers();

  if (!state.receiverLocation) {
    updateReceiverStatus();
    return;
  }

  const position = [
    state.receiverLocation.lat,
    state.receiverLocation.lon
  ];

  state.receiverMarker = L.circleMarker(position, {
    radius: 7,
    color: '#111',
    weight: 2,
    fillColor: '#ffdf4d',
    fillOpacity: 1
  }).addTo(state.map);

  state.receiverMarker.bindPopup(
    `<div class="popup-title">Receiver Site</div>
     <div>Latitude: ${state.receiverLocation.lat.toFixed(6)}</div>
     <div>Longitude: ${state.receiverLocation.lon.toFixed(6)}</div>`
  );

  for (const ringNm of RANGE_RINGS_NM) {
    const ring = L.circle(position, {
      radius: ringNm * 1852,
      color: '#ffdf4d',
      weight: 1,
      opacity: 0.50,
      fill: false,
      dashArray: '5 7',
      interactive: false
    });

    ring.addTo(state.map);
    state.ringLayers.push(ring);
  }

  updateReceiverStatus();
}

function beginReceiverSelection() {
  state.settingReceiverLocation = true;
  const button = document.getElementById('set-receiver');
  button.classList.add('active');
  button.textContent = 'Click map location...';
  state.map.getContainer().style.cursor = 'crosshair';
  updateReceiverStatus('Click the map at your receiver antenna location.');
}

function finishReceiverSelection(latlng) {
  state.receiverLocation = {
    lat: latlng.lat,
    lon: latlng.lng
  };

  state.settingReceiverLocation = false;

  const button = document.getElementById('set-receiver');
  button.classList.remove('active');
  button.textContent = 'Set receiver';
  state.map.getContainer().style.cursor = '';

  saveReceiverLocation();
  drawReceiverLocation();
}

function clearReceiverLocation() {
  state.settingReceiverLocation = false;
  state.receiverLocation = null;

  const button = document.getElementById('set-receiver');
  button.classList.remove('active');
  button.textContent = 'Set receiver';
  state.map.getContainer().style.cursor = '';

  saveReceiverLocation();
  drawReceiverLocation();
}

function distanceAndBearing(a) {
  if (!state.receiverLocation || !hasPosition(a)) {
    return null;
  }

  const toRad = degrees => degrees * Math.PI / 180;
  const toDeg = radians => radians * 180 / Math.PI;

  const lat1 = toRad(state.receiverLocation.lat);
  const lon1 = toRad(state.receiverLocation.lon);
  const lat2 = toRad(a.Lat);
  const lon2 = toRad(a.Long);

  const dLat = lat2 - lat1;
  const dLon = lon2 - lon1;

  const h =
    Math.sin(dLat / 2) * Math.sin(dLat / 2) +
    Math.cos(lat1) * Math.cos(lat2) *
    Math.sin(dLon / 2) * Math.sin(dLon / 2);

  const distanceNm = 3440.065 * 2 * Math.atan2(Math.sqrt(h), Math.sqrt(1 - h));

  const y = Math.sin(dLon) * Math.cos(lat2);
  const x =
    Math.cos(lat1) * Math.sin(lat2) -
    Math.sin(lat1) * Math.cos(lat2) * Math.cos(dLon);

  const bearing = (toDeg(Math.atan2(y, x)) + 360) % 360;

  return {
    distanceNm,
    bearing
  };
}

function updateTrail(a) {
  const id = String(a.Id);
  const point = [a.Lat, a.Long];
  const points = state.trailPoints.get(id) || [];
  const previous = points.length ? points[points.length - 1] : null;

  /*
   * Only record an actual position change. A visible line requires two
   * different decoded ADS-B positions from the same aircraft.
   */
  if (!previous || previous[0] !== point[0] || previous[1] !== point[1]) {
    points.push(point);

    while (points.length > state.trailMaxPoints) {
      points.shift();
    }

    state.trailPoints.set(id, points);
  }

  if (points.length < 2) {
    return;
  }

  if (!state.trailLayers.has(id)) {
    const layer = L.polyline(points, {
      color: '#00d7ff',
      weight: 3,
      opacity: 0.90,
      dashArray: '7 5',
      lineCap: 'round',
      lineJoin: 'round',
      interactive: false
    });

    state.trailLayers.set(id, layer);

    if (state.showTrails) {
      layer.addTo(state.map);
    }
  } else {
    state.trailLayers.get(id).setLatLngs(points);
  }
}

function removeTrail(id) {
  if (state.trailLayers.has(id)) {
    state.map.removeLayer(state.trailLayers.get(id));
    state.trailLayers.delete(id);
  }

  state.trailPoints.delete(id);
}

function setTrailsVisible(visible) {
  state.showTrails = visible;

  for (const layer of state.trailLayers.values()) {
    if (visible) {
      layer.addTo(state.map);
    } else {
      state.map.removeLayer(layer);
    }
  }
}

function clearTrails() {
  for (const layer of state.trailLayers.values()) {
    state.map.removeLayer(layer);
  }

  state.trailLayers.clear();
  state.trailPoints.clear();
}

function updateMarkers(acList) {
  const seen = new Set();

  state.aircraftById = new Map(
    acList.map(a => [String(a.Id), a])
  );

  for (const a of acList) {
    if (!hasPosition(a)) continue;

    const id = String(a.Id);
    seen.add(id);

    /*
     * Center once on the first aircraft with decoded coordinates.
     */
    if (!state.initialPlaneCentered) {
      state.map.setView([a.Lat, a.Long], state.map.getZoom());
      state.initialPlaneCentered = true;
    }

    if (!state.markers.has(id)) {
      const marker = L.marker([a.Lat, a.Long], {
        icon: aircraftIcon(a),
        bubblingMouseEvents: false
      });

      marker.addTo(state.map);

      marker.on('click', () => {
        selectAircraft(id);
      });

      state.markers.set(id, marker);
    }

    const marker = state.markers.get(id);
    marker.setLatLng([a.Lat, a.Long]);
    marker.setIcon(aircraftIcon(a));
    marker.bindPopup(popupHtml(a));

    updateTrail(a);
  }

  for (const [id, marker] of state.markers.entries()) {
    if (!seen.has(id)) {
      state.map.removeLayer(marker);
      state.markers.delete(id);

      /*
       * Intentionally retain the trail after an aircraft falls out of the
       * active feed. This makes completed tracks visible until the user
       * presses Clear trails or refreshes the page.
       */
    }
  }
}

function updateTable(acList) {
  const rows = document.getElementById('rows');
  rows.innerHTML = '';

  const sorted = [...acList].sort((a, b) => {
    const ac = aircraftName(a);
    const bc = aircraftName(b);
    return ac.localeCompare(bc);
  });

  for (const a of sorted) {
    const tr = document.createElement('tr');
    const id = String(a.Id);
    const name = aircraftName(a);
    const range = distanceAndBearing(a);
    const distance = range ? `${range.distanceNm.toFixed(1)} nm` : '';
    const bearing = range ? `${range.bearing.toFixed(0)}°` : '';

    if (id === state.selectedId) {
      tr.className = 'selected-row';
    }

    tr.innerHTML = `
      <td><span class="callsign">${name}</span><br><span class="muted">${fmt(a.Icao)}</span></td>
      <td>${fmt(a.Alt)}</td>
      <td>${fmt(a.Spd)}</td>
      <td>${fmt(a.Trak)}</td>
      <td>${fmt(a.CMsgs)}</td>
      <td>${fmt(a.TSecs, 's')}</td>
      <td>${fmt(distance)}</td>
      <td>${fmt(bearing)}</td>
    `;

    tr.onclick = () => {
      state.selectedId = id;
      refreshMarkerIcons();
      updateTable(acList);

      if (hasPosition(a) && state.markers.has(id)) {
        state.map.setView([a.Lat, a.Long], Math.max(state.map.getZoom(), 9));
        state.markers.get(id).openPopup();
      }
    };

    rows.appendChild(tr);
  }
}

async function refresh() {
  const status = document.getElementById('status');

  try {
    const response = await fetch('/VirtualRadar/AircraftList.json?_=' + Date.now());
    const data = await response.json();
    const acList = data.acList || [];
    const positioned = acList.filter(hasPosition).length;

    status.textContent =
      `Aircraft: ${data.totalAc || acList.length} | Positioned: ${positioned} | Server: ${new Date(data.stm).toLocaleString()}`;

    updateMarkers(acList);
    updateTable(acList);
  } catch (e) {
    status.textContent = 'Error loading aircraft feed: ' + e;
  }
}

async function main() {
  await loadConfig();
  initMap();

  document.getElementById('show-trails').addEventListener('change', event => {
    setTrailsVisible(event.target.checked);
  });

  document.getElementById('clear-trails').addEventListener('click', () => {
    clearTrails();
  });

  document.getElementById('set-receiver').addEventListener('click', () => {
    beginReceiverSelection();
  });

  document.getElementById('clear-receiver').addEventListener('click', () => {
    clearReceiverLocation();
  });

  loadReceiverLocation();
  drawReceiverLocation();

  await refresh();
  setInterval(refresh, 1000);
}

main();
</script>

<style>
.rx-control {
  background: rgba(18, 18, 18, 0.95);
  border: 1px solid #555;
  border-radius: 6px;
  box-shadow: 0 2px 9px rgba(0,0,0,0.55);
  color: #eee;
  font: 13px Arial, sans-serif;
  min-width: 205px;
  padding: 10px;
}
.rx-control-title {
  color: #ffdf4d;
  font-size: 14px;
  font-weight: bold;
  margin-bottom: 8px;
}
.rx-control-buttons {
  display: flex;
  gap: 6px;
  margin-bottom: 8px;
}
.rx-control button {
  background: #252525;
  border: 1px solid #666;
  border-radius: 4px;
  color: #eee;
  cursor: pointer;
  font-size: 12px;
  padding: 5px 8px;
}
.rx-control button:hover {
  background: #363636;
}
.rx-control button.active {
  background: #886d00;
  border-color: #ffdf4d;
}
.rx-control-status {
  color: #ccc;
  font-size: 11px;
  line-height: 1.35;
}
.rx-ring-label {
  background: rgba(20,20,20,0.82);
  border: 1px solid #ffdf4d;
  border-radius: 3px;
  box-shadow: none;
  color: #ffdf4d;
  font-size: 10px;
  padding: 1px 4px;
}
.rx-ring-label::before {
  display: none;
}
</style>

<script id="receiver-rings-overlay-v1">
(function () {
  const STORAGE_KEY = 'plutoAdsBReceiverOverlayLocationV1';
  const RANGE_RINGS_NM = [25, 50, 100, 150];

  let map = null;
  let receiverMarker = null;
  let ringLayers = [];
  let selecting = false;
  let setButton = null;
  let statusElement = null;

  function setStatus(text) {
    if (statusElement) statusElement.textContent = text;
  }

  function removeLayers() {
    if (!map) return;

    if (receiverMarker) {
      map.removeLayer(receiverMarker);
      receiverMarker = null;
    }

    for (const layer of ringLayers) {
      map.removeLayer(layer);
    }

    ringLayers = [];
  }

  function saveLocation(location) {
    try {
      if (location) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(location));
      } else {
        localStorage.removeItem(STORAGE_KEY);
      }
    } catch (e) {
      console.log('Receiver location storage failed:', e);
    }
  }

  function loadLocation() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (!saved) return null;

      const parsed = JSON.parse(saved);
      if (typeof parsed.lat === 'number' && typeof parsed.lon === 'number') {
        return parsed;
      }
    } catch (e) {
      console.log('Receiver location load failed:', e);
    }

    return null;
  }

  function drawReceiver(location) {
    removeLayers();

    if (!location) {
      setStatus('Receiver location not set.');
      return;
    }

    const point = [location.lat, location.lon];

    receiverMarker = L.circleMarker(point, {
      radius: 7,
      color: '#151515',
      weight: 2,
      fillColor: '#ffdf4d',
      fillOpacity: 1
    }).addTo(map);

    receiverMarker.bindPopup(
      '<b>Receiver Site</b><br>' +
      'Lat: ' + location.lat.toFixed(6) + '<br>' +
      'Lon: ' + location.lon.toFixed(6)
    );

    for (const distanceNm of RANGE_RINGS_NM) {
      const ring = L.circle(point, {
        radius: distanceNm * 1852,
        color: '#ffdf4d',
        weight: 2,
        opacity: 0.72,
        fill: false,
        dashArray: '7 7',
        interactive: false
      }).addTo(map);

      ring.bindTooltip(distanceNm + ' nm', {
        permanent: true,
        direction: 'right',
        className: 'rx-ring-label',
        opacity: 0.90
      });

      ringLayers.push(ring);
    }

    setStatus(
      'Receiver: ' +
      location.lat.toFixed(5) + ', ' +
      location.lon.toFixed(5) +
      ' | Rings: 25 / 50 / 100 / 150 nm'
    );
  }

  function startSelection() {
    selecting = true;
    setButton.classList.add('active');
    setButton.textContent = 'Click map...';
    map.getContainer().style.cursor = 'crosshair';
    setStatus('Click the map at the receiver antenna location.');
  }

  function finishSelection(latlng) {
    const location = {
      lat: latlng.lat,
      lon: latlng.lng
    };

    selecting = false;
    setButton.classList.remove('active');
    setButton.textContent = 'Set receiver';
    map.getContainer().style.cursor = '';

    saveLocation(location);
    drawReceiver(location);
  }

  function clearReceiver() {
    selecting = false;
    setButton.classList.remove('active');
    setButton.textContent = 'Set receiver';
    map.getContainer().style.cursor = '';

    saveLocation(null);
    drawReceiver(null);
  }

  function installOverlay() {
    if (typeof L === 'undefined' ||
        typeof state === 'undefined' ||
        !state.map) {
      window.setTimeout(installOverlay, 250);
      return;
    }

    map = state.map;

    const ReceiverControl = L.Control.extend({
      options: {
        position: 'topright'
      },

      onAdd: function () {
        const panel = L.DomUtil.create('div', 'rx-control');
        panel.innerHTML =
          '<div class="rx-control-title">Receiver / Range Rings</div>' +
          '<div class="rx-control-buttons">' +
          '  <button type="button" id="rx-overlay-set">Set receiver</button>' +
          '  <button type="button" id="rx-overlay-clear">Clear</button>' +
          '</div>' +
          '<div class="rx-control-status" id="rx-overlay-status">' +
          'Receiver location not set.' +
          '</div>';

        L.DomEvent.disableClickPropagation(panel);
        L.DomEvent.disableScrollPropagation(panel);

        return panel;
      }
    });

    new ReceiverControl().addTo(map);

    setButton = document.getElementById('rx-overlay-set');
    statusElement = document.getElementById('rx-overlay-status');

    setButton.addEventListener('click', startSelection);
    document.getElementById('rx-overlay-clear').addEventListener('click', clearReceiver);

    map.on('click', function (event) {
      if (selecting) {
        finishSelection(event.latlng);
      }
    });

    drawReceiver(loadLocation());
  }

  installOverlay();
})();
</script>

</body>
</html>
